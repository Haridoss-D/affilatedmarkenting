<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin | AffiliatePro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-guard="admin">
    <div id="nav"></div>
    <section>
        <div class="wrap">
            <h1>Admin <span class="grad">Dashboard</span></h1>
            <p id="an" class="glass" style="margin:14px 0"></p>
            <div class="tabs"><button data-t="products">Products</button><button
                    data-t="categories">Categories</button><button data-t="blog">Blog</button><button
                    data-t="banners">Banners</button><button data-t="users">Users</button></div>
            <form id="form" class="glass" style="display:grid;gap:8px"></form>
            <div class="glass scroll" style="margin-top:16px">
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Info</th>
                        <th></th>
                    </tr>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
    </section>
    <div id="footer"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
