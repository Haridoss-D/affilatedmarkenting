<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Products | AffiliatePro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div id="nav"></div>
    <section>
        <div class="wrap">
            <div class="sec-h">
                <h2>Products</h2>
            </div>
            <div class="banner" id="demo" style="display:none">Demo data – Flask API offline</div><br>
            <div class="filters"><input id="s" placeholder="Search…"><select id="cat"></select><input id="pmin"
                    type="number" placeholder="Min ₹"><input id="pmax" type="number" placeholder="Max ₹"><select
                    id="sort">
                    <option value="new">Newest</option>
                    <option value="lo">Price ↑</option>
                    <option value="hi">Price ↓</option>
                    <option value="rate">Top rated</option>
                </select></div>
            <div class="grid" id="grid"></div>
        </div>
    </section>
    <button class="btn" id="cmp" onclick="openCmp()"></button>
    <div id="cmpBox" class="glass" style="display:none;position:fixed;inset:10% 5%;z-index:70;overflow:auto"><button
            class="btn sm" onclick="cmpBox.style.display='none'">Close</button>
        <div id="cmpBody"></div>
    </div>
    <div id="footer"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script>initList()</script>
    <script src="js/main.js"></script>
</body>

</html>
